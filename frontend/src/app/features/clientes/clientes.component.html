<div class="clientes-page">

    <header class="clientes-header">

        <div>
            <h1>Clientes</h1>
            <p>Administración de clientes</p>
        </div>

    </header>

    <div class="clientes-container">

        <!-- ========================= -->
        <!-- Formulario -->
        <!-- ========================= -->

        <div class="form-card">

            <h2>
                {{ clienteSeleccionado ? 'Editar Cliente' : 'Nuevo Cliente' }}
            </h2>

            <form
                [formGroup]="clienteForm"
                (ngSubmit)="guardarCliente()">

                <div class="form-group">

                    <label>Nombre</label>

                    <input
                        type="text"
                        formControlName="nombre">

                </div>

                <div class="form-group">

                    <label>Empresa</label>

                    <input
                        type="text"
                        formControlName="empresa">

                </div>

                <div class="form-group">

                    <label>Teléfono</label>

                    <input
                        type="text"
                        formControlName="telefono">

                </div>

                <div class="form-group">

                    <label>Correo</label>

                    <input
                        type="email"
                        formControlName="correo">

                </div>

                <div class="botones">

                    <button
                        class="btn-guardar"
                        type="submit">

                        {{ clienteSeleccionado ? 'Actualizar' : 'Guardar' }}

                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        (click)="limpiarFormulario()">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

        <!-- ========================= -->
        <!-- Tabla -->
        <!-- ========================= -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>Nombre</th>

                        <th>Empresa</th>

                        <th>Teléfono</th>

                        <th>Correo</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody>

                    <tr
                        *ngFor="let cliente of clientes">

                        <td>{{cliente.nombre}}</td>

                        <td>{{cliente.empresa}}</td>

                        <td>{{cliente.telefono}}</td>

                        <td>{{cliente.correo}}</td>

                        <td>

                            <button
                                class="btn-editar"
                                (click)="editar(cliente)">

                                Editar

                            </button>

                            <button
                                class="btn-eliminar"
                                (click)="eliminar(cliente._id)">

                                Eliminar

                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
