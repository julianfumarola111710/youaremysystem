<div class="dashboard-page">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo-area">

            <img
                src="logopitahaya.png"
                class="logo">

            <h2>PITAHAYA CRM</h2>

        </div>

        <nav>

            <button routerLink="/dashboard">
                🏠 Dashboard
            </button>

            <button routerLink="/usuarios">
                👤 Usuarios
            </button>

            <button routerLink="/clientes">
                👥 Clientes
            </button>

            <button routerLink="/productos">
                📦 Productos
            </button>

            <button routerLink="/ventas">
                💰 Ventas
            </button>

            <button routerLink="/actividades">
                📅 Actividades
            </button>

            <button routerLink="/tickets">
                🎫 Tickets
            </button>

            <button routerLink="/notificaciones">
                🔔 Notificaciones
            </button>

        </nav>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <div class="card">

            <h1>Gestión de Clientes</h1>

            <form
                [formGroup]="clienteForm"
                (ngSubmit)="guardarCliente()">

                <div class="fila">

                    <div class="campo">

                        <label>Nombre</label>

                        <input
                            type="text"
                            formControlName="nombre">

                    </div>

                    <div class="campo">

                        <label>Empresa</label>

                        <input
                            type="text"
                            formControlName="empresa">

                    </div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label>Teléfono</label>

                        <input
                            type="text"
                            formControlName="telefono">

                    </div>

                    <div class="campo">

                        <label>Correo</label>

                        <input
                            type="email"
                            formControlName="correo">

                    </div>

                </div>

                <div class="botones">

                    <button
                        type="submit"
                        class="guardar">

                        {{ clienteSeleccionado ? 'Actualizar Cliente' : 'Guardar Cliente' }}

                    </button>

                    <button
                        type="button"
                        class="cancelar"
                        (click)="limpiarFormulario()">

                        Limpiar

                    </button>

                </div>

            </form>

        </div>

        <div class="card">

            <h2>Listado de Clientes</h2>

            <table>

                <thead>

                    <tr>

                        <th>Nombre</th>

                        <th>Empresa</th>

                        <th>Teléfono</th>

                        <th>Correo</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let cliente of clientes">

                        <td>{{cliente.nombre}}</td>

                        <td>{{cliente.empresa}}</td>

                        <td>{{cliente.telefono}}</td>

                        <td>{{cliente.correo}}</td>

                        <td>

                            <button
                                class="editar"
                                (click)="editar(cliente)">

                                Editar

                            </button>

                            <button
                                class="eliminar"
                                (click)="eliminar(cliente._id)">

                                Eliminar

                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>
