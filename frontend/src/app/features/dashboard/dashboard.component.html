<div class="dashboard-page">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo-area">

            <img
                src="logopitahaya.png"
                class="logo">

            <h2>PITAHAYA CRM</h2>

        </div>

        <nav>

            <button routerLink="/dashboard">
                🏠 Dashboard
            </button>

            <button routerLink="/usuarios">
                👤 Usuarios
            </button>

            <button routerLink="/clientes">
                👥 Clientes
            </button>

            <button routerLink="/productos">
                📦 Productos
            </button>

            <button routerLink="/ventas">
                💰 Ventas
            </button>

            <button routerLink="/actividades">
                📅 Actividades
            </button>

            <button routerLink="/tickets">
                🎫 Tickets
            </button>

            <button routerLink="/notificaciones">
                🔔 Notificaciones
            </button>

        </nav>

        <button
            class="logout"
            (click)="logout()">

            Cerrar sesión

        </button>

    </aside>

    <!-- Contenido -->

    <main class="contenido">

        <div class="welcome-card">

            <h1>Bienvenido a Pitahaya CRM</h1>

            <p>

                Seleccione un módulo desde el menú de la izquierda.

            </p>

        </div>

    </main>

</div>
