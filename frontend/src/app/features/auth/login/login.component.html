<div class="login-page">

  <div class="login-card">

    <div class="login-brand">
      <img src="assets/logopitahaya.png" alt="Pitahaya CRM" class="brand-logo">
      <p class="brand-subtitle">Acceso al sistema</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder="usuario@pitahaya.com"
          autocomplete="username">

        <span
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Ingresa un correo válido
        </span>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password">

        <span
          class="field-error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          La contraseña es requerida
        </span>
      </div>

      <button type="submit" class="btn-login">
        Iniciar sesión
      </button>

    </form>

  </div>

  <footer class="login-footer">
    <p>PITAHAYA CRM</p>
  </footer>

</div>
