<div class="login-page">

  <div class="login-card">

    <div class="login-brand">
      <img src="logopitahaya.png" alt="Pitahaya CRM" class="brand-logo">
      <p class="brand-subtitle">Acceso al sistema</p>
    </div>

    <div *ngIf="verificandoUsuarios" class="verificando">

      Verificando sistema...

    </div>

    <div *ngIf="!verificandoUsuarios && !hayUsuarios" class="primer-uso">

      <p class="primer-uso-texto">

        No se detectaron usuarios en el sistema. Cree el administrador inicial para comenzar.

      </p>

      <div class="mensaje-error-login" *ngIf="mensajeError">

        {{ mensajeError }}

      </div>

      <button
        type="button"
        class="btn-login"
        [disabled]="creandoAdmin"
        (click)="crearAdminInicial()">

        {{ creandoAdmin ? 'Creando administrador...' : 'Crear usuario administrador' }}

      </button>

      <p class="primer-uso-credenciales">

        Correo: admin&#64;crm.com — Contraseña: Admin123*

      </p>

    </div>

    <form
      *ngIf="!verificandoUsuarios && hayUsuarios"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="login-form">

      <div class="mensaje-error-login" *ngIf="mensajeError">

        {{ mensajeError }}

      </div>

      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder="usuario@pitahaya.com"
          autocomplete="username">

        <span
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Ingresa un correo válido
        </span>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password">

        <span
          class="field-error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          La contraseña es requerida
        </span>
      </div>

      <button type="submit" class="btn-login">
        Iniciar sesión
      </button>

    </form>

  </div>

  <footer class="login-footer">
    <p>PITAHAYA CRM</p>
  </footer>

</div>
