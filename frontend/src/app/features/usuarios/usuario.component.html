<div class="dashboard-page">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo-area">

            <img
                src="logopitahaya.png"
                class="logo">

            <h2>PITAHAYA CRM</h2>

        </div>

        <nav>

            <button routerLink="/dashboard">
                🏠 Dashboard
            </button>

            <button routerLink="/usuarios">
                👤 Usuarios
            </button>

            <button routerLink="/clientes">
                👥 Clientes
            </button>

            <button routerLink="/productos">
                📦 Productos
            </button>

            <button routerLink="/ventas">
                💰 Ventas
            </button>

            <button routerLink="/actividades">
                📅 Actividades
            </button>

            <button routerLink="/tickets">
                🎫 Tickets
            </button>

            <button routerLink="/notificaciones">
                🔔 Notificaciones
            </button>

        </nav>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <div class="card">

            <h1>Gestión de Usuarios</h1>

            <form
                [formGroup]="usuarioForm"
                (ngSubmit)="guardarUsuario()">

                <div class="fila">

                    <div class="campo">

                        <label>Nombre</label>

                        <input
                            type="text"
                            formControlName="nombre">

                    </div>

                    <div class="campo">

                        <label>Correo</label>

                        <input
                            type="email"
                            formControlName="email">

                    </div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label>Contraseña</label>

                        <input
                            type="password"
                            formControlName="password">

                    </div>

                    <div class="campo">

                        <label>Rol</label>

                        <select formControlName="rol">

                            <option value="user">

                                Usuario

                            </option>

                            <option value="admin">

                                Administrador

                            </option>

                        </select>

                    </div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label>

                            <input
                                type="checkbox"
                                formControlName="activo">

                            Usuario Activo

                        </label>

                    </div>

                </div>

                <div class="botones">

                    <button
                        type="submit"
                        class="guardar">

                        {{ usuarioSeleccionado ? 'Actualizar Usuario' : 'Guardar Usuario' }}

                    </button>

                    <button
                        type="button"
                        class="cancelar"
                        (click)="limpiarFormulario()">

                        Limpiar

                    </button>

                </div>

            </form>

        </div>

        <div class="card">

            <h2>Listado de Usuarios</h2>

            <table>

                <thead>

                    <tr>

                        <th>Nombre</th>

                        <th>Correo</th>

                        <th>Rol</th>

                        <th>Activo</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let usuario of usuarios">

                        <td>{{usuario.nombre}}</td>

                        <td>{{usuario.email}}</td>

                        <td>{{usuario.rol}}</td>

                        <td>

                            {{ usuario.activo ? 'Sí' : 'No' }}

                        </td>

                        <td>

                            <button
                                class="editar"
                                (click)="editar(usuario)">

                                Editar

                            </button>

                            <button
                                class="eliminar"
                                (click)="eliminar(usuario._id)">

                                Eliminar

                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>
